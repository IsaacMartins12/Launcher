[project]
name = "launch-backend"
version = "1.0.0"
description = "Backend API para o sistema de Horas Complementares"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
