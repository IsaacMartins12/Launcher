version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: launch
    volumes:
      - ./launch-backend/flaskr/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./launch-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "2500:2500"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: launch
      FLASK_APP: flaskr/app.py
      FLASK_DEBUG: "1"
      SECRET_KEY: dev-secret-key-change-in-production

  frontend:
    build:
      context: ./autofront
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:2500

volumes:
  mysql_data:
